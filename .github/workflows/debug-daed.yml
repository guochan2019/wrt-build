name: Debug daed build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y clang-22 lld-22 llvm-22
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 200
          sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-22 200
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-22 200
          sudo -E apt-get -qq install -y dwarves
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Clone Source Code
        run: |
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          cd /workdir
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load Custom Feeds
        run: |
          cp feeds.conf.default openwrt/feeds.conf.default
          chmod +x diy-part1.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy-part1.sh

      - name: Update Feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Remove conflicting official packages
        run: |
          cd openwrt
          rm -rf feeds/packages/net/mosdns
          rm -rf feeds/packages/net/v2ray-geodata
          rm -rf feeds/packages/net/daed
          rm -rf feeds/luci/applications/luci-app-openclash
          rm -rf feeds/luci/applications/luci-app-daed
          ./scripts/feeds update -i packages
          ./scripts/feeds update -i luci

      - name: Add vmlinux-btf package
        run: |
          git clone --depth 1 https://github.com/QiuSimons/vmlinux-btf.git openwrt/feeds/packages/net/vmlinux-btf
          cd openwrt && ./scripts/feeds update -i packages

      - name: Install Feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          [ -e files ] && cp -r files openwrt/files
          cp .config openwrt/.config
          chmod +x diy-part2.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy-part2.sh

      - name: Download daed source
        run: |
          cd openwrt
          make defconfig
          make package/feeds/daed/daed/download V=s

      - name: Debug daed Build/Prepare V=s
        run: |
          cd openwrt
          echo "=== daed Build/Prepare ==="
          make package/feeds/daed/daed/prepare V=s 2>&1
          echo "exit code: $?"
          echo "=== check webrender/web/ ==="
          ls -la build_dir/target-x86_64_musl/daed-*/wing/webrender/web/ 2>&1 || echo "dir not found"

      - name: Debug daed Compile V=s
        run: |
          cd openwrt
          echo "=== daed Compile V=s ==="
          make package/feeds/daed/daed/compile V=s 2>&1 || true
